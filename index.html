<!DOCTYPE html>
<!-- v20260718 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>청소 당번표 관리</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4a6b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="청소당번표">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  :root{
    --ink:#374151;
    --paper:#f4f6fb;
    --card:#ffffff;
    --line:#e2e8f5;
    --navy:#5b7ec7;
    --navy-dark:#4566b0;
    --blue:#7ba7e8;
    --blue-light:#eef3fd;
    --red:#e8788a;
    --red-dark:#d45c70;
    --red-light:#fff0f3;
    --surface:#f7f9fe;
    --muted:#8b96b0;
    /* compat */
    --moss:#e8788a;
    --moss-dark:#d45c70;
    --clay:#f4a56a;
    --clay-light:#fde8d4;
    --amber:#f7c96e;
    --amber-light:#fef6dc;
    --danger:#e8788a;
    --danger-light:#fde8ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Pretendard',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:#f4f6fb;
    background-image:
      radial-gradient(800px 500px at 50% -6%, rgba(91,126,199,0.10), transparent 65%),
      radial-gradient(600px 400px at 100% 20%, rgba(232,120,138,0.06), transparent 60%),
      linear-gradient(180deg,#edf1fb 0%,#f4f6fb 40%,#fafbff 100%);
    background-attachment:fixed;
  }
  .app{max-width:960px;margin:0 auto;padding:0 0 80px;}

  /* ── AUTH ── */
  #authScreen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;}
  #authScreen.show{display:flex;}
  .auth-card{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(91,126,199,0.15);}
  .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .auth-logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#4566b0,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .auth-title{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
  .auth-tabs{display:flex;border-radius:12px;background:var(--surface);padding:3px;margin-bottom:24px;}
  .auth-tab{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);}
  .auth-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
  .auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .auth-field label{font-size:12px;font-weight:600;color:var(--muted);}
  .auth-field input{border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:border .2s;}
  .auth-field input:focus{border-color:var(--navy);}
  .auth-btn{width:100%;padding:13px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:background .2s;margin-top:4px;}
  .auth-btn:hover{background:var(--navy-dark);}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .auth-google{width:100%;padding:11px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s;}
  .auth-google:hover{border-color:var(--navy);}
  .auth-msg{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;min-height:18px;}
  .auth-msg.error{color:#e8788a;}
  .auth-msg.success{color:#15803d;}

  /* ── HERO SLIDESHOW ── */
  .hero{
    width:100%;position:relative;overflow:hidden;
    border-radius:0 0 28px 28px;margin-bottom:28px;
    background:linear-gradient(135deg,#3730a3 0%,#6d28d9 50%,#a21caf 100%);
    padding:36px 28px 32px;box-sizing:border-box;
  }
  .hero-text{position:relative;z-index:2;color:#fff;}
  .hero-text .brand{font-size:26px;font-weight:900;letter-spacing:-0.8px;}
  .hero-text .sub{font-size:12.5px;opacity:0.82;margin-top:5px;max-width:280px;line-height:1.6;}
  .hero-deco{position:absolute;right:-20px;top:-20px;opacity:0.08;}
  /* ── NAV ── */
  .app-inner{padding:0 20px;}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .brand{font-size:24px;font-weight:900;letter-spacing:-0.5px;}
  .brand span{color:var(--red);}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  nav{
    display:flex;gap:3px;margin-bottom:22px;flex-wrap:wrap;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:5px;
    box-shadow:0 3px 14px rgba(30,58,138,0.09);
  }
  nav button{
    background:none;border:none;padding:9px 18px;font-size:13.5px;font-weight:700;color:var(--muted);
    cursor:pointer;border-radius:10px;transition:background .15s,color .15s;
  }
  nav button:hover{background:var(--blue-light);color:var(--navy);}
  nav button.active{color:#fff;background:var(--navy);box-shadow:0 2px 10px rgba(30,58,138,0.30);}

  /* ── CARD ── */
  .card{
    background:#fff;border:1.5px solid var(--line);border-radius:18px;
    padding:20px 22px;margin-bottom:16px;
    box-shadow:0 4px 20px rgba(30,58,138,0.07);
  }
  .card h2{font-size:16px;margin:0 0 4px;color:var(--navy);}
  .card .desc{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  /* ── INPUTS ── */
  input[type=text],input[type=number],select{
    border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;
    background:var(--surface);color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:700;}

  /* ── BUTTONS ── */
  button.btn{
    border:none;background:var(--red);color:#fff;padding:10px 18px;
    border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;
    box-shadow:0 3px 10px rgba(224,48,48,0.30);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  }
  button.btn:hover{background:var(--red-dark);transform:translateY(-2px);box-shadow:0 5px 14px rgba(224,48,48,0.38);}
  button.btn.ghost{background:none;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;}
  button.btn.ghost:hover{background:var(--blue-light);border-color:var(--blue);transform:none;}
  button.btn.danger{background:var(--danger);color:#fff;box-shadow:0 3px 8px rgba(220,38,38,0.28);}
  button.btn.danger:hover{background:#b91c1c;transform:translateY(-1px);}
  button.btn.ghost.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
  button.btn.ghost.danger:hover{background:#b91c1c;border-color:#b91c1c;}
  button.btn.small{padding:5px 10px;font-size:12px;}

  /* ── TABLE ── */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:12px;}

  /* ── TAGS ── */
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.mentor{background:#fef3c7;color:#b45309;}
  .tag.mentee{background:#fed7aa;color:#9a3412;}
  .tag.normal{background:var(--surface);color:var(--muted);}
  .tag.worker{background:#e0e7ff;color:#3730a3;}
  .tag.m{background:#dbeafe;color:#1d4ed8;}
  .tag.f{background:#fce7f3;color:#9d174d;}

  /* ── PEOPLE LIST ── */
  .prow{display:grid;grid-template-columns:28px 1fr auto auto auto auto auto;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;}
  .prow:hover{background:var(--blue-light);}
  .prow.mentee-row{background:#fffbf5;padding-left:32px;grid-template-columns:28px 1fr auto auto auto auto auto;}
  .prow.mentee-row .mentee-indent{display:inline-block;color:var(--muted);margin-right:4px;font-size:11px;}
  .prow.selected{background:#fff0f0;}
  .prow.mentor-row{border-left:3px solid var(--amber);}
  .prow.mentee-row{border-left:3px solid var(--clay);}
  .prow.worker-row{border-left:3px solid #6366f1;}
  .prow-name{font-weight:600;}
  .mentor-badge{font-size:10px;background:#fef3c7;color:#b45309;border-radius:10px;padding:1px 6px;font-weight:700;margin-left:4px;}
  .edit-row td{background:var(--blue-light);}
  .edit-row input,.edit-row select{padding:4px 6px;font-size:12px;width:auto;}
  .inline-edit{display:none;position:absolute;z-index:10;background:#fff;border:1.5px solid var(--blue);border-radius:8px;padding:4px 6px;font-size:12px;box-shadow:0 4px 12px rgba(30,58,138,0.15);}
  .editable-cell{position:relative;cursor:pointer;}
  .editable-cell:hover .edit-hint{opacity:1;}
  .edit-hint{opacity:0;font-size:10px;color:var(--blue);margin-left:3px;transition:opacity 0.15s;}

  /* ── NUKKI SELECT BTN ── */
  .nukki-select-btn{
    display:flex;flex-direction:column;align-items:center;cursor:pointer;
    user-select:none;transition:transform 0.15s;
    filter:drop-shadow(0 3px 8px rgba(30,58,138,0.22));
  }
  .nukki-select-btn:hover{transform:scale(1.08);}
  .nukki-select-btn:active{transform:scale(0.95);}
  .nukki-select-btn img{width:160px;height:auto;display:block;}
  .nukki-select-btn .sel-label{
    background:var(--navy);color:#fff;font-size:10px;font-weight:700;
    padding:2px 10px;border-radius:20px;margin-top:-8px;white-space:nowrap;
  }
  .nukki-select-btn.all-selected .sel-label{background:var(--red);}

  /* ── FILTER TABS ── */
  .filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-tab{border:1.5px solid var(--line);background:#fff;color:var(--muted);
    padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
  .filter-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .filter-tab[data-f="worker"].active{background:#4f46e5;border-color:#4f46e5;}

  /* ── SECTIONS ── */
  .section-label{font-size:11px;font-weight:800;color:var(--navy);padding:12px 10px 4px;letter-spacing:0.8px;text-transform:uppercase;opacity:0.65;}
  .gender-sublabel{font-size:11px;font-weight:700;color:var(--muted);padding:6px 18px 2px;opacity:0.6;}
  .section-mgr{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .section-mgr-label{font-size:11px;font-weight:700;color:var(--muted);margin-right:2px;}
  .section-chip{display:inline-flex;align-items:center;gap:3px;background:var(--blue-light);border:1.5px solid #bfdbfe;border-radius:20px;padding:3px 10px 3px 12px;font-size:12px;color:var(--navy);font-weight:600;}
  .section-chip-del{background:none;border:none;cursor:pointer;color:var(--blue);font-size:12px;padding:0 0 0 2px;line-height:1;}
  .section-chip-del:hover{color:var(--red);}
  .section-add-btn{background:none;border:1.5px dashed var(--line);border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;color:var(--muted);}
  .section-add-btn:hover{border-color:var(--blue);color:var(--navy);}
  #sectionAddForm{display:none;align-items:center;gap:6px;margin-bottom:10px;}

  /* ── AREA INLINE ── */
  .area-inline{border:1.5px solid var(--line);border-radius:7px;padding:3px 6px;font-size:13px;text-align:center;background:var(--surface);}
  .area-inline:focus{outline:none;border-color:var(--blue);}

  /* ── EMPTY / MISC ── */
  .empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .board-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .board-title h2{margin:0;color:var(--navy);}

  /* ── AREA STEPPER ── */
  .stepper{display:inline-flex;align-items:center;gap:4px;}
  .stepper button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:background .15s;}
  .stepper button:hover{background:var(--blue-light);border-color:var(--blue);}
  .stepper .val{min-width:22px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);}
  .stepper input.val{border:none;background:transparent;outline:none;width:36px;padding:0;cursor:text;-moz-appearance:textfield;}
  .stepper input.val::-webkit-outer-spin-button,.stepper input.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stepper input.val:focus{background:var(--blue-light);border-radius:4px;}
  .indoor-toggle{display:inline-flex;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);font-size:12px;}
  .indoor-toggle button{padding:3px 10px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;transition:background .15s,color .15s;}
  .indoor-toggle button.active{background:var(--navy);color:#fff;}

  /* ── SCHEDULE / ZONE ── */
  #captureArea{background:#fff;padding:24px;border-radius:18px;border:1.5px solid var(--line);box-shadow:0 4px 20px rgba(30,58,138,0.07);}
  .zone{
    border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:10px;
    background:linear-gradient(135deg,#f0f5ff 0%,#ffffff 100%);
    box-shadow:0 2px 8px rgba(30,58,138,0.06);
  }
  .zone-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .zone-name{font-weight:800;font-size:14.5px;color:var(--navy);}
  .zone-meta{font-size:11.5px;color:var(--muted);}
  .zone-people{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    background:var(--blue-light);border:1px solid #bfdbfe;border-radius:20px;padding:5px 12px;font-size:12.5px;
    display:flex;align-items:center;gap:6px;color:var(--navy);
  }
  .chip button{border:none;background:none;color:var(--danger);cursor:pointer;font-size:13px;padding:0;line-height:1;}
  .warn-badge{background:var(--danger-light);color:var(--danger);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
  .add-select{display:flex;gap:6px;margin-top:8px;}

  /* ── STATUS / HISTORY ── */
  .status-pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .status-pill.draft{background:#fef3c7;color:#b45309;}
  .status-pill.confirmed{background:#dbeafe;color:var(--navy);}
  .history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .history-item:hover{background:var(--blue-light);}
  .project-tab{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
  .project-tab:hover{border-color:var(--blue);color:var(--navy);}
  .project-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* ── UPLOAD ── */
  .upload-box{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;background:var(--surface);}
  .upload-box:hover{border-color:var(--blue);background:var(--blue-light);}
  .note{background:#fef3c7;color:#b45309;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:12px;}

  /* ── TOAST ── */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:13px;
    box-shadow:0 6px 24px rgba(30,58,138,0.35);z-index:50;
    display:flex;align-items:center;gap:12px;
  }
  .toast-undo{background:none;border:1.5px solid rgba(255,255,255,0.45);color:#fff;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .toast-undo:hover{background:rgba(255,255,255,0.15);}

  /* ── BULK BAR ── */
  .bulk-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;
    padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:40;
    box-shadow:0 -3px 18px rgba(30,58,138,0.28);font-size:13px;
  }
  .bulk-bar select,.bulk-bar input{font-size:12px;padding:5px 8px;border-radius:6px;border:none;color:var(--ink);}
  .bulk-bar .bulk-count{font-weight:700;margin-right:4px;}

  /* ── MISC ── */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .month-label{font-family:'Georgia',serif;font-size:20px;font-weight:700;color:var(--navy);}
</style>
</head>
<body>
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="auth-title">청소 당번표 관리</div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="authTabLogin" onclick="switchAuthTab('login')">로그인</div>
      <div class="auth-tab" id="authTabSignup" onclick="switchAuthTab('signup')">회원가입</div>
    </div>
    <div class="auth-field"><label>이메일</label><input type="email" id="authEmail" placeholder="example@email.com"></div>
    <div class="auth-field"><label>비밀번호</label><input type="password" id="authPw" placeholder="6자 이상" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="auth-btn" onclick="doAuth()" id="authSubmitBtn">로그인</button>
    <div class="auth-divider">또는</div>
    <button class="auth-google" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Google로 계속하기
    </button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>
<div class="app" id="root" style="display:none;"></div>

function dbPersonToState(p){
  return { id:p.id, name:p.name, gender:p.gender, category:p.category, team:p.team||'', role:p.role||null, mentorId:p.mentor_id, age:p.age||null };
}
function dbAreaToState(a){
  return { id:a.id, name:a.name, capacity:a.capacity, difficulty:a.difficulty, genderFilter:a.gender_filter||'all', fixedPeople:a.fixed_people||[], isIndoor:a.is_indoor!==false, inspectorJoins:a.inspector_joins||false, requireWorker:a.require_worker||false };
}
function dbScheduleToState(s){
  return { id:s.id, month:s.month, label:s.label||null, assignments:s.assignments||{}, status:s.status, notes:s.notes||[], createdAt: new Date(s.created_at).getTime() };
}

async function loadAll(){
  try{
    const [{data:people}, {data:areas}, {data:schedules}] = await Promise.all([
      sb.from('people').select('*').order('created_at', {ascending:true}),
      sb.from('areas').select('*').order('created_at', {ascending:true}),
      sb.from('schedules').select('*').order('created_at', {ascending:true})
    ]);
    state.people = (people||[]).map(dbPersonToState);
    state.areas = (areas||[]).map(dbAreaToState);
    const allSchedules = (schedules||[]).map(dbScheduleToState);
    state.history = allSchedules.filter(s=>s.status==='confirmed');
    state.projects = allSchedules.filter(s=>s.status==='draft');
    if(!state.draft && state.projects.length>0) state.draft = state.projects[0];
    else if(state.draft) state.draft = state.projects.find(p=>p.id===state.draft.id) || state.projects[0] || null;
  }catch(e){
    toast('Supabase 연결에 문제가 있어요.');
  }
  state.loaded = true;
  render();
}

async function createDraftDB(draft){

}

}

function uid(){ return Math.random().toString(36).slice(2,9); }
function toast(msg, undoFn=null){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className='toast';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  let timer;
  if(undoFn){
    const btn = document.createElement('button');
    btn.className='toast-undo'; btn.textContent='되돌리기';
    btn.onclick = ()=>{ clearTimeout(timer); t.remove(); undoFn(); };
    t.appendChild(btn);
    timer = setTimeout(()=>t.remove(), 5000);
  } else {
    timer = setTimeout(()=>t.remove(), 2200);
  }
  document.body.appendChild(t);
}

  return `<div class="${rowClass}" data-pid="${p.id}" style="grid-template-columns:28px 1fr auto auto auto auto auto auto auto;">
    <input type="checkbox" class="p-check" data-id="${p.id}" ${sel?'checked':''} style="cursor:pointer;width:15px;height:15px;">
    <span class="prow-name" style="display:flex;align-items:center;gap:4px;">
      ${isMentee?'<span class="mentee-indent">└</span>':''}
      <span class="inline-name" data-edit-name="${p.id}" style="cursor:pointer;" title="클릭해서 이름 수정">${p.name}</span>
      ${p.category==='mentor'?'<span class="mentor-badge">멘토</span>':''}
    </span>
    <span class="editable-cell" data-toggle="gender" data-id="${p.id}" title="클릭해서 수정">
      <span class="tag ${p.gender}">${genderLabel(p.gender)}</span><span class="edit-hint">✎</span>
    </span>
    <span class="editable-cell" data-toggle="category" data-id="${p.id}" title="클릭해서 수정">
      <span class="tag ${p.category}">${catLabel(p.category)}</span><span class="edit-hint">✎</span>
    </span>
    <span class="editable-cell" data-toggle="team" data-id="${p.id}" title="클릭해서 수정" style="min-width:50px;">
      <span style="font-size:12px;color:${p.team?'var(--ink)':'var(--muted)'};">${p.team||'팀없음'}</span><span class="edit-hint">✎</span>
    </span>
    <span class="editable-cell" data-toggle="role" data-id="${p.id}" title="클릭해서 수정">
      ${p.role==='리더' ? `<span style="font-size:11px;font-weight:800;color:#fff;background:#7c3aed;border-radius:8px;padding:2px 8px;">리더</span>` : p.role==='멋쟁이' ? `<span style="font-size:11px;font-weight:800;color:#fff;background:#db2777;border-radius:8px;padding:2px 8px;">멋쟁이</span>` : p.role==='점검자' ? `<span style="font-size:11px;font-weight:800;color:#fff;background:#0369a1;border-radius:8px;padding:2px 8px;">점검자</span>` : `<span style="font-size:11px;color:var(--muted);">-</span>`}<span class="edit-hint">✎</span>
    </span>
    <span class="editable-cell" data-toggle="age" data-id="${p.id}" title="클릭해서 수정">

    </span>

function renderPeopleTab(){
  const f = state._peopleFilter;
  const sel = state._selectedPeople;

  const mentors = state.people.filter(p=>p.category==='mentor');
  const counts = { all: state.people.length, worker: state.people.filter(p=>p.category==='worker').length };
  state._sections.forEach(s=>{ counts[s] = state.people.filter(p=>p.team===s&&p.category!=='worker').length; });

  const s0 = state._peopleSort;
  const filterBar = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
    <div class="filter-tabs" style="margin-bottom:0;flex:1;">

      <button class="filter-tab${f==='worker'?' active':''}" data-f="worker">사역자 ${counts.worker}</button>
      ${state._sections.map(s=>`<button class="filter-tab${f===s?' active':''}" data-f="${s}">${s} ${counts[s]||0}</button>`).join('')}
    </div>
    <div class="indoor-toggle" style="flex-shrink:0;">
      <button class="${s0==='default'?'active':''}" data-people-sort="default">기본순</button>
      <button class="${s0==='role-leader'?'active':''}" data-people-sort="role-leader">리더순</button>
    </div>
  </div>`;

  // 섹션 관리 UI
  const sectionMgr = `
  <div class="section-mgr">
    <span class="section-mgr-label">섹션</span>
    ${state._sections.map(s=>`<span class="section-chip">${s}<button class="section-chip-del" data-del-section="${s}">✕</button></span>`).join('')}

  </div>
  <div id="sectionAddForm" style="display:none;gap:6px;align-items:center;margin-bottom:10px;">
    <input type="text" id="sectionNameInput" placeholder="섹션 이름" style="flex:1;max-width:160px;">
    <button class="btn small" id="sectionConfirmBtn">확인</button>
    <button class="btn ghost small" id="sectionCancelBtn">취소</button>
  </div>`;

  // 표시할 인원
  function applySort(arr){
    if(state._peopleSort==='role-leader') return [...arr].sort((a,b)=>{ const r={'리더':0,'멋쟁이':1}; return (r[a.role]??2)-(r[b.role]??2); });
    return arr;
  }
  const visible = applySort(f==='all' ? state.people
    : f==='worker' ? state.people.filter(p=>p.category==='worker')
    : state.people.filter(p=>p.team===f&&p.category!=='worker'));

  // 성별 서브그룹 렌더링 헬퍼
  function renderWithGender(group, trackIds){
    let r = '';
    // 멘토에 연결된 멘티는 독립 행으로 렌더하지 않고 멘토 아래에 체인으로 붙임
    const chainedMenteeIds = new Set(
      state.people.filter(p=>p.category==='mentee' && p.mentorId).map(p=>p.id)
    );
    function renderGroupChained(subgroup){
      let gr = '';
      subgroup.forEach(p=>{
        if(chainedMenteeIds.has(p.id)) return;
        if(trackIds) trackIds.add(p.id);
        gr += renderPersonRow(p, false);
        if(p.category==='mentor'){
          state.people.filter(m=>m.category==='mentee' && m.mentorId===p.id).forEach(m=>{
            if(trackIds) trackIds.add(m.id);
            gr += renderPersonRow(m, true);
          });
        }
      });
      return gr;
    }
    const males = group.filter(p=>p.gender==='m');
    const females = group.filter(p=>p.gender==='f');
    if(males.length>0){
      r += `<div class="gender-sublabel">🙋‍♂️ 남자 (${males.length}명)</div>`;
      r += renderGroupChained(males);
    }
    if(females.length>0){
      r += `<div class="gender-sublabel">🙋‍♀️ 여자 (${females.length}명)</div>`;
      r += renderGroupChained(females);
    }
    return r;
  }

  // 팀별 섹션 렌더링
  let rows = '';
  const usedIds = new Set();
  if(f==='all'){
    const workers = applySort(state.people.filter(p=>p.category==='worker'));
    if(workers.length>0){
      rows += `<div class="section-label">🔧 사역자 (${workers.length}명)</div>`;
      rows += renderWithGender(workers, usedIds);
    }
    state._sections.forEach(s=>{
      const group = applySort(state.people.filter(p=>p.team===s&&p.category!=='worker'));
      if(group.length>0){
        rows += `<div class="section-label">📌 ${s} (${group.length}명)</div>`;
        rows += renderWithGender(group, usedIds);
      }
    });
    const etc = applySort(state.people.filter(p=>!usedIds.has(p.id)));
    if(etc.length>0){
      rows += `<div class="section-label">👤 기타 (${etc.length}명)</div>`;
      rows += renderWithGender(etc, null);
    }
  } else {
    rows += renderWithGender(visible, null);
  }

  const allChecked = state.people.length>0 && state.people.every(p=>sel.has(p.id));

  const bulkBar = sel.size>0 ? `
    <div class="bulk-bar">
      <span class="bulk-count">${sel.size}명 선택</span>

      <select id="bulk_category"><option value="">카테고리 변경...</option><option value="normal">일반</option><option value="mentor">멘토</option><option value="mentee">멘티</option><option value="worker">사역자</option></select>
      <input type="text" id="bulk_team" placeholder="팀 일괄 변경..." style="width:120px;">
      <select id="bulk_role" style="width:90px;font-size:13px;"><option value="">역할 변경...</option><option value="리더">리더</option><option value="멋쟁이">멋쟁이</option><option value="점검자">점검자</option><option value="없음">없음</option></select>
      <input type="number" id="bulk_age" placeholder="나이" min="1" max="120" style="width:70px;">
      <button class="btn small" id="bulkApplyBtn" style="background:#fff;color:var(--moss-dark);border-color:#fff;">일괄 적용</button>
      <button class="btn small" id="bulkDeleteBtn" style="background:#b5453a;border-color:#b5453a;color:#fff;">삭제</button>
      <button class="btn ghost small" id="bulkCancelBtn" style="color:#fff;border-color:rgba(255,255,255,0.4);">취소</button>
    </div>` : '';

  return `
    <div class="card" style="overflow:hidden;position:relative;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <h2>이미지로 불러오기</h2>
          <p class="desc">명렬표나 청소 당번표 이미지를 올리면 구역과 인원을 자동으로 추출해드려요.</p>
          <div class="upload-box" id="uploadBox">이미지를 클릭해서 선택하거나 드래그해서 놓아주세요<br><span style="font-size:11px">JPG, PNG 지원</span></div>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <div id="uploadStatus" style="font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7;"></div>
          <div id="importPreview"></div>
        </div>
        <div style="flex-shrink:0;align-self:center;width:80px;height:80px;background:var(--blue-light);border-radius:20px;display:flex;align-items:center;justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b5bdb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        </div>
      </div>
    </div>
    <div class="card" style="overflow:hidden;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div style="flex:1;min-width:0;">
          <h2>인원 추가</h2>
      <div class="row">
        <label class="f">이름<input type="text" id="p_name" placeholder="이름"></label>

function renderDraftBoard(entry, editable){
  const monthStr = entry.month;
  const zonesHtml = state.areas.map(area=>{
    const assigned = entry.assignments[area.id] || [];
    const warn = assigned.length !== area.capacity;
    const peopleChips = assigned.map(pid=>{
      const p = personById(pid);
      if(!p) return '';
      return `<span class="chip">${p.name} <span class="tag ${p.category}" style="padding:1px 6px;font-size:10px;">${catLabel(p.category)}</span> ${editable?`<button data-remove-assign="${area.id}|${pid}">✕</button>`:''}</span>`;
    }).join('');
    const availablePeople = state.people.filter(p=>!Object.values(entry.assignments).flat().includes(p.id));
    return `
      <div class="zone">
        <div class="zone-head">
          <div>
            <span class="zone-name">${area.name}</span>
            <span class="zone-meta"> · 필요 ${area.capacity}명</span>
            ${area.inspectorJoins ? `<span style="font-size:11px;color:#0369a1;background:#e0f2fe;border-radius:10px;padding:1px 7px;margin-left:4px;">점검자 동행</span>` : ''}
          </div>
          ${warn?`<span class="warn-badge">인원 ${assigned.length}/${area.capacity}</span>`:''}
        </div>
        <div class="zone-people">${peopleChips || '<span class="empty" style="padding:0;">배정된 인원 없음</span>'}</div>
        ${editable?`
        <div class="add-select">
          <select data-add-to="${area.id}">
            <option value="">인원 추가...</option>
            ${availablePeople.map(p=>`<option value="${p.id}">${p.name} (${catLabel(p.category)}${p.role?'·'+p.role:''})</option>`).join('')}
          </select>
        </div>`:''}
      </div>
    `;
  }).join('');

  const unassigned = state.people.filter(p=>!Object.values(entry.assignments).flat().includes(p.id));
  const assignedAll = Object.values(entry.assignments).flat();
  const totalPeople = state.people.length;
  const assignedCount = state.people.filter(p=>assignedAll.includes(p.id)).length;
  const totalCapacity = state.areas.reduce((s,a)=>s+a.capacity,0);
  const pct = totalPeople>0 ? Math.round(assignedCount/totalPeople*100) : 0;
  const barColor = pct===100 ? 'var(--navy)' : pct>=80 ? 'var(--blue)' : 'var(--red)';

  return `
    <div class="card">
      <div class="board-title">
        <div>
          <div class="month-label">${entry.label || monthStr}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:1px;">${entry.label ? monthStr : ''}</div>
          <span class="status-pill ${entry.status}">${entry.status==='draft'?'초안':'확정'}</span>
        </div>
        <div class="row">
          ${editable && entry.status==='draft' ? `<button class="btn ghost" id="regenBtn">다시 생성</button><button class="btn" id="confirmBtn">확정 저장</button><button class="btn ghost small danger" id="deleteProjectBtn" style="color:var(--red);">삭제</button>` : ''}
          <div style="display:flex;align-items:center;gap:6px;">
            <input id="exportTitle" type="text" value="${entry.label || entry.month} 본부 건물 청소당번표" style="font-size:12px;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:200px;" placeholder="이미지 제목">
            <button class="btn ghost" id="exportImgBtn">이미지로 저장</button>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-radius:10px;margin-bottom:12px;">
        <div style="font-size:22px;font-weight:800;color:${barColor};line-height:1;">${assignedCount}<span style="font-size:13px;font-weight:500;color:var(--muted);">/${totalPeople}명</span></div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;">
            <span>배정 인원</span>
            <span>구역 정원 합계 ${totalCapacity}명</span>
          </div>
          <div style="height:7px;border-radius:4px;background:var(--line);overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .4s;"></div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:700;color:${barColor};">${pct}%</div>
        ${unassigned.length>0 ? `<div style="font-size:12px;color:var(--red);font-weight:600;">미배정 ${unassigned.length}명</div>` : '<div style="font-size:12px;color:var(--navy);font-weight:600;">전원 배정 완료 ✓</div>'}
      </div>
      ${entry.notes && entry.notes.length ? `<div class="note">${entry.notes.join('<br>')}</div>` : ''}
      <div id="captureArea">
        <div style="font-weight:700;font-size:16px;margin-bottom:14px;">${monthStr} 청소 당번표</div>
        ${zonesHtml}
        ${unassigned.length ? `<div class="zone" style="border-style:dashed;"><div class="zone-name" style="margin-bottom:6px;">미배정 인원</div><div class="zone-people">${unassigned.map(p=>`<span class="chip">${p.name}</span>`).join('')}</div></div>` : ''}
      </div>
    </div>
  `;
}

          ${u.email||'-'}
        </div>
        <div style="font-size:12px;color:var(--muted);">${new Date(u.created_at).toLocaleDateString('ko-KR')}</div>

async function adminDeleteUser(userId, email){
  if(!confirm(`"${email}" 계정을 삭제할까요?\n해당 계정의 모든 데이터(인원/구역/배정)도 함께 삭제됩니다.`)) return;
  const {data:{session}} = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-user`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({targetUserId:userId})
  });
  if(res.ok){ toast(`"${email}" 계정을 삭제했어요.`); setTab('admin'); }
  else { const e=await res.json(); toast('삭제 실패: '+(e.error||res.statusText)); }
}

function renderHistoryTab(){
  if(state.history.length===0) return '<div class="card"><div class="empty">아직 확정된 배정표 이력이 없어요.</div></div>';
  const items = [...state.history].reverse().map(h=>`
    <div class="history-item" data-view-history="${h.id}">
      <div><strong>${h.month}</strong> <span class="status-pill ${h.status}" style="margin-left:8px;">확정</span></div>
      <span style="color:var(--muted);font-size:12px;">${Object.values(h.assignments).flat().length}명 배정</span>
    </div>
  `).join('');
  return `<div class="card"><h2>지난 배정표</h2>${items}</div>
    <div id="historyDetail"></div>`;
}

// ---------- assignment algorithm ----------
function currentMonthLabel(){
  const now = new Date();
  return `${now.getFullYear()}년 ${now.getMonth()+1}월`;
}

function buildUnits(){
  // role=점검자는 자동 배정 제외 — 수동 배정
  const students = state.people.filter(p=>p.role!=='점검자');
  const mentees = students.filter(p=>p.category==='mentee');
  const mentors = students.filter(p=>p.category==='mentor');
  const used = new Set();
  const units = [];
  mentors.forEach(m=>{
    const myMentees = mentees.filter(me=>me.mentorId===m.id);
    const members = [m, ...myMentees];
    members.forEach(mm=>used.add(mm.id));
    units.push({
      id: uid(),
      members,
      gender: m.gender,
      teams: [...new Set(members.map(x=>x.team||''))]
    });
  });
  students.forEach(p=>{
    if(used.has(p.id)) return;
    units.push({ id: uid(), members:[p], gender:p.gender, teams:[p.team||''] });
  });
  return units;
}

function lastAreaMap(){
  const confirmed = state.history.filter(h=>h.status==='confirmed');
  if(confirmed.length===0) return {};
  const last = confirmed[confirmed.length-1];
  const map = {};
  Object.entries(last.assignments).forEach(([areaId, pids])=>{
    pids.forEach(pid=> map[pid]=areaId);
  });
  return map;
}

function assignCounts(){
  const counts = {};
  state.people.forEach(p=>counts[p.id]=0);
  state.history.forEach(h=>{
    Object.values(h.assignments).flat().forEach(pid=>{ if(counts[pid]!==undefined) counts[pid]++; });
  });
  return counts;
}

function generateDraft(){
  const notes = [];
  const units = buildUnits();
  const lastMap = lastAreaMap();
  const counts = assignCounts();
  const unitScore = (u)=> u.members.reduce((s,m)=>s+ (counts[m.id]||0), 0) / u.members.length;

  const areasSorted = [...state.areas].sort((a,b)=>b.difficulty-a.difficulty);
  const assignments = {};
  state.areas.forEach(a=> assignments[a.id]=[]);

  // 한 사람은 한 달에 한 구역에만 배정 — 이미 배정된 인원 추적
  const assignedPeople = new Set();

  // Fisher-Yates 셔플로 균등 랜덤
  const shuffle = (arr) => { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr; };
  let remainingUnits = shuffle([...units]);

  // 루프 전에 모든 구역의 고정인원을 미리 remainingUnits에서 제거
  state.areas.forEach(area=>{
    (area.fixedPeople||[]).forEach(pid=>{
      assignedPeople.add(pid);
      remainingUnits = remainingUnits.filter(u=>!u.members.some(m=>m.id===pid));
    });
  });


  areasSorted.forEach(area=>{
    // 고정인원 배치
    const fixedIds = (area.fixedPeople||[]).filter(pid=> state.people.find(p=>p.id===pid));
    fixedIds.forEach(pid=>{
      if(!assignments[area.id].includes(pid)) assignments[area.id].push(pid);
    });


    let filled = assignments[area.id].length;
    const target = area.inspectorJoins ? Math.max(1, area.capacity - 1) : area.capacity;
    const areaGenderReq = area.genderFilter && area.genderFilter !== 'all' ? area.genderFilter : null;

    const teamsInArea = () => new Set(assignments[area.id].map(pid=>state.people.find(p=>p.id===pid)?.team||''));

    // 팀 밸런스 점수: 초등/중고등 팀이 구역에 없으면 해당 팀 유닛 최우선
    const TARGET_TEAMS = ['중고등', '초등'];
    const teamDiversityScore = (u) => {
      const present = teamsInArea();
      const missingTargets = TARGET_TEAMS.filter(t => !present.has(t));
      const unitTeams = new Set(u.members.map(m => m.team || ''));
      if(missingTargets.some(t => unitTeams.has(t))) return -2; // 없는 핵심 팀을 채움
      if(u.members.some(m => !present.has(m.team || ''))) return -1; // 새 팀 추가
      return 0;
    };

    const globalAvgAge = (() => {
      const ages = state.people.filter(p=>p.age&&p.role!=='점검자').map(p=>p.age);
      return ages.length ? ages.reduce((s,a)=>s+a,0)/ages.length : 0;
    })();
    const sortByBalance = () => {
      const areaAssigned = assignments[area.id];
      const hasKeyRole = areaAssigned.some(pid=>{
        const p = state.people.find(x=>x.id===pid);
        return p?.role==='리더' || p?.role==='멋쟁이';
      });
      const areaAges = areaAssigned.map(pid=>state.people.find(x=>x.id===pid)?.age).filter(Boolean);
      const areaAvgAge = areaAges.length ? areaAges.reduce((s,a)=>s+a,0)/areaAges.length : globalAvgAge;
      const areasWithKeyRole = Object.values(assignments).filter(pids=>pids.some(pid=>{const p=state.people.find(x=>x.id===pid);return p?.role==='리더'||p?.role==='멋쟁이';})).length;
      const roleScore = (u) => {
        const unitHasKey = u.members.some(m=>m.role==='리더'||m.role==='멋쟁이');
        if(!unitHasKey) return 0;
        if(!hasKeyRole) return -2; // 이 구역에 아직 없으면 최우선
        return areasWithKeyRole < state.areas.length * 0.6 ? 1 : 0; // 아직 많은 구역이 비어있으면 여기 추가 억제
      };
      const ageScore = (u) => {
        if(!globalAvgAge) return 0;
        const unitAges = u.members.map(m=>m.age).filter(Boolean);
        if(!unitAges.length) return 0;
        const allAges = [...areaAges, ...unitAges];
        const newAreaAvg = allAges.reduce((s,a)=>s+a,0)/allAges.length;
        return Math.abs(newAreaAvg - globalAvgAge) < Math.abs(areaAvgAge - globalAvgAge) ? -1 : 0;
      };
      remainingUnits.sort((a,b)=>
        (teamDiversityScore(a) - teamDiversityScore(b)) ||
        (roleScore(a) - roleScore(b)) ||
        (ageScore(a) - ageScore(b)) ||
        (unitScore(a) - unitScore(b)) ||
        (Math.random() - 0.5)
      );
    };

    // 구역 내 성별 통일 (성별 필터 없으면 먼저 배정된 성별 기준)
    const areaCurrentGender = () => {
      for(const pid of assignments[area.id]){
        const p = state.people.find(x=>x.id===pid);
        if(p) return p.gender;
      }
      return null;
    };
    const genderMixOk = (u) => {
      if(areaGenderReq) return u.members.every(m=>m.gender===areaGenderReq);
      const cur = areaCurrentGender();
      if(cur===null) return true;
      return u.members.every(m=>m.gender===cur);
    };

    let i=0;
    while(filled < target && i < remainingUnits.length){
      sortByBalance();
      const u = remainingUnits[i];
      const size = u.members.length;
      if(filled + size > target){ i++; continue; }
      // 다른 구역에 예약된 사역자 유닛은 건너뜀
      if(u._reservedFor && u._reservedFor !== area.id){ i++; continue; }
      const genderOk = (areaGenderReq===null || u.members.every(m=>m.gender===areaGenderReq)) && genderMixOk(u);
      const noRepeat = u.members.every(m=> lastMap[m.id] !== area.id);
      // 필립·진우 동일 구역 배정 금지
      const PHILIP_ID = '5d3cb209-5f00-432b-9821-c8f8187199c9';
      const JINWOO_ID = '7854506c-fa23-4d18-97a8-7b45613ec9b6';
      const areaHasPhilip = assignments[area.id].includes(PHILIP_ID);
      const areaHasJinwoo = assignments[area.id].includes(JINWOO_ID);
      const unitHasPhilip = u.members.some(m=>m.id===PHILIP_ID);
      const unitHasJinwoo = u.members.some(m=>m.id===JINWOO_ID);
      const noConflict = !((areaHasPhilip && unitHasJinwoo) || (areaHasJinwoo && unitHasPhilip));
      // 구역당 멋쟁이 1명 제한 + 멋쟁이는 리더 있는 구역에만
      const areaHasLeader = assignments[area.id].some(pid=>state.people.find(x=>x.id===pid)?.role==='리더');
      const areaHasFashion = assignments[area.id].some(pid=>state.people.find(x=>x.id===pid)?.role==='멋쟁이');
      const unitHasFashion = u.members.some(m=>m.role==='멋쟁이');
      const fashionOk = !unitHasFashion || (!areaHasFashion && areaHasLeader);
      if(genderOk && noRepeat && noConflict && fashionOk){
        assignments[area.id].push(...u.members.map(m=>m.id));
        u.members.forEach(m=>assignedPeople.add(m.id));
        filled += size;
        remainingUnits.splice(i,1);
        i = 0;
      } else {
        i++;
      }
    }
    if(filled < target){
      // 반복 배정 금지 완화
      i=0;
      while(filled < target && i < remainingUnits.length){
        const u = remainingUnits[i];
        const size = u.members.length;
        if(filled + size > target){ i++; continue; }
        if(u._reservedFor && u._reservedFor !== area.id){ i++; continue; }
        const genderOk = (areaGenderReq===null || u.members.every(m=>m.gender===areaGenderReq)) && genderMixOk(u);
        const areaHasPhilip2 = assignments[area.id].includes('5d3cb209-5f00-432b-9821-c8f8187199c9');
        const areaHasJinwoo2 = assignments[area.id].includes('7854506c-fa23-4d18-97a8-7b45613ec9b6');
        const noConflict2 = !((areaHasPhilip2 && u.members.some(m=>m.id==='7854506c-fa23-4d18-97a8-7b45613ec9b6')) || (areaHasJinwoo2 && u.members.some(m=>m.id==='5d3cb209-5f00-432b-9821-c8f8187199c9')));
        const areaHasLeader2 = assignments[area.id].some(pid=>state.people.find(x=>x.id===pid)?.role==='리더');
        const areaHasFashion2 = assignments[area.id].some(pid=>state.people.find(x=>x.id===pid)?.role==='멋쟁이');
        const fashionOk2 = !u.members.some(m=>m.role==='멋쟁이') || (!areaHasFashion2 && areaHasLeader2);
        if(genderOk && noConflict2 && fashionOk2){
          assignments[area.id].push(...u.members.map(m=>m.id));
          u.members.forEach(m=>assignedPeople.add(m.id));
          filled += size;
          remainingUnits.splice(i,1);
          notes.push(`"${area.name}" 배정 시 연속 배정 금지 조건을 완화했어요. 확인해주세요.`);
        } else { i++; }
      }
    }
    if(filled < target){
      notes.push(`"${area.name}"에 인원이 부족해요 (${filled}/${area.capacity}명). 직접 채워주세요.`);
    }
  });

  if(remainingUnits.length>0){
    notes.push(`미배정 인원이 있어요. 구역별 정원을 확인하거나 직접 배정해주세요.`);
  }

  return {
    id: uid(),
    month: currentMonthLabel(),
    assignments,
    status: 'draft',
    notes,
    createdAt: Date.now()
  };
}

    const cancelPersonBtn = document.getElementById('cancelPersonBtn');

      pNameInput.value='';

      const category = document.getElementById('p_category').value;

      const mentorId = category==='mentee' ? (document.getElementById('p_mentor').value || null) : null;

      state.people.push(person);
      pNameInput.value=''; cancelPersonBtn.style.display='none';
      render();
      toast('인원을 추가했어요.', async ()=>{
        await deletePersonDB(person.id);
        state.people = state.people.filter(p=>p.id!==person.id);
        render();
        toast(`${person.name} 추가를 취소했어요.`);
      });
    };

    document.querySelectorAll('.p-check').forEach(chk=>{
      chk.onclick = (e)=>{
        e.stopPropagation();

        if(chk.checked) state._selectedPeople.add(id);
        else state._selectedPeople.delete(id);
        render();
      };
    });
    // 누끼 전체 선택 버튼
    // 인원 이름 인라인 수정
    document.querySelectorAll('[data-edit-name]').forEach(span=>{
      span.onclick = (e)=>{
        e.stopPropagation();
        const id = span.dataset.editName;
        const person = state.people.find(p=>String(p.id)===String(id));
        if(!person) return;
        const inp = document.createElement('input');
        inp.value = person.name;
        inp.style.cssText = 'font-size:13px;font-weight:600;border:1px solid var(--blue);border-radius:4px;padding:1px 6px;width:80px;outline:none;';
        span.replaceWith(inp);
        inp.focus(); inp.select();
        const save = async ()=>{
          const val = inp.value.trim();
          if(val && val !== person.name){
            person.name = val;
            await updatePersonDB(person);
            toast(`이름을 "${val}"로 변경했어요.`);
          }
          render();
        };

      };
    });

    document.querySelectorAll('.filter-tab').forEach(btn=>{
      btn.onclick = ()=>{ state._peopleFilter = btn.dataset.f; render(); };

    // 멘토 → 멘티 연결 select

        const p = state.people.find(x=>x.id===sel.dataset.inlineMentor);
        if(!p) return;
        p.mentorId = sel.value || null;
        await updatePersonDB(p);
        render();
        toast('멘토를 변경했어요.');
      };
    });

    // 삭제
    document.querySelectorAll('[data-del-person]').forEach(b=>{
      b.onclick = async (e)=>{
        e.stopPropagation();
        const rawId = b.dataset.delPerson;
        const id = isNaN(rawId) ? rawId : Number(rawId);
        const deleted = state.people.find(p=>p.id==rawId);
        await deletePersonDB(id);
        await clearMentorRefDB(id);
        state.people = state.people.filter(p=>p.id!=rawId);
        state.people.forEach(p=>{ if(p.mentorId==rawId) p.mentorId=null; });
        state._selectedPeople.forEach(sid=>{ if(String(sid)===rawId) state._selectedPeople.delete(sid); });
        render();
        if(deleted) toast(`${deleted.name}을(를) 삭제했어요.`, async ()=>{
          const restored = {...deleted, id:undefined};
          await addPersonDB(restored);
          state.people.push(restored);
          render();
          toast(`${deleted.name}을(를) 복원했어요.`);
        });
      };
    });

    // 일괄 수정
    const bulkApplyBtn = document.getElementById('bulkApplyBtn');
    if(bulkApplyBtn){
      bulkApplyBtn.onclick = async()=>{
        const gender = document.getElementById('bulk_gender').value;
        const category = document.getElementById('bulk_category').value;
        const team = document.getElementById('bulk_team').value.trim();
        const roleRaw = document.getElementById('bulk_role').value;
        const role = roleRaw || null;
        const ageRaw = document.getElementById('bulk_age').value;
        const age = ageRaw ? parseInt(ageRaw) : null;
        const targets = state.people.filter(p=>state._selectedPeople.has(p.id));
        for(const p of targets){
          if(gender) p.gender=gender;
          if(category) p.category=category;
          if(team) p.team=team;
          if(role!==null) p.role = role==='없음' ? null : role;
          if(age) p.age=age;
          await updatePersonDB(p);
        }
        state._selectedPeople.clear();
        render();
        toast(`${targets.length}명을 수정했어요.`);
      };
      document.getElementById('bulkCancelBtn').onclick=()=>{ state._selectedPeople.clear(); render(); };
      document.getElementById('bulkDeleteBtn').onclick = async()=>{
        const targets = state.people.filter(p=>state._selectedPeople.has(p.id));
        if(!confirm(`선택한 ${targets.length}명을 삭제할까요?`)) return;
        const snapshot = targets.map(p=>({...p}));
        for(const p of targets){
          await sb.from('people').delete().eq('id',p.id);
          state.people = state.people.filter(x=>x.id!==p.id);
        }
        state._selectedPeople.clear();
        render();
        toast(`${targets.length}명을 삭제했어요.`, async ()=>{
          for(const p of snapshot){
            const restored = {...p, id:undefined};
            await addPersonDB(restored);
            state.people.push(restored);
          }
          render();
          toast(`${snapshot.length}명을 복원했어요.`);
        });
      };
    }

    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    uploadBox.onclick = ()=> fileInput.click();
    uploadBox.ondragover = (e)=>{ e.preventDefault(); uploadBox.style.borderColor='var(--moss)'; };
    uploadBox.ondrop = (e)=>{ e.preventDefault(); if(e.dataTransfer.files[0]) handleRosterImage(e.dataTransfer.files[0]); };
    fileInput.onchange = ()=>{ if(fileInput.files[0]) handleRosterImage(fileInput.files[0]); };
  }

  // areas tab
  const addAreaBtn = document.getElementById('addAreaBtn');
  if(addAreaBtn){
    addAreaBtn.onclick = async ()=>{
      const name = document.getElementById('a_name').value.trim();
      if(!name){ toast('구역명을 입력해주세요.'); return; }
      const capacity = parseInt(document.getElementById('a_capacity').value)||1;
      const difficulty = 1;
      const genderFilter = document.getElementById('a_gender').value||'all';
      const isIndoor = document.getElementById('a_indoor').value !== 'false';
      const area = { name, capacity, difficulty, genderFilter, fixedPeople:[], isIndoor };
      await addAreaDB(area);
      state.areas.push(area);
      render();
      toast('구역을 추가했어요.');
    };
    document.querySelectorAll('[data-del-area]').forEach(b=>{
      b.onclick = async ()=>{
        await deleteAreaDB(b.dataset.delArea);
        state.areas = state.areas.filter(a=>a.id!==b.dataset.delArea);
        render();
      };
    });

    // 고정인원 해제
    document.querySelectorAll('[data-unfix-person]').forEach(b=>{
      b.onclick = async ()=>{
        const [areaId, pid] = b.dataset.unfixPerson.split('|');
        const area = state.areas.find(a=>String(a.id)===String(areaId));
        if(!area) return;
        area.fixedPeople = (area.fixedPeople||[]).filter(id=>String(id)!==String(pid));
        await updateAreaDB(area);
        render();
        toast('고정인원을 해제했어요.');
      };
    });

    // 스테퍼 (+/-)
    document.querySelectorAll('[data-step-area]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.stepArea;
        const field = b.dataset.stepField;
        const dir = parseInt(b.dataset.stepDir);
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        const min = 1;
        const max = field==='difficulty' ? 5 : 99;
        const newVal = Math.min(max, Math.max(min, (area[field]||1) + dir));
        area[field] = newVal;
        await updateAreaDB(area);
        render();
      };
    });

    // 구역 이름 인라인 수정
    document.querySelectorAll('[data-edit-area-name]').forEach(span=>{
      span.onclick = ()=>{
        const id = span.dataset.editAreaName;
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        const inp = document.createElement('input');
        inp.value = area.name;
        inp.style.cssText = 'font-size:13px;font-weight:600;border:1px solid var(--blue);border-radius:4px;padding:1px 6px;width:90px;outline:none;';
        span.replaceWith(inp);
        inp.focus(); inp.select();
        const save = async ()=>{
          const val = inp.value.trim();
          if(val && val !== area.name){
            area.name = val;
            await updateAreaDB(area);
            toast(`구역명을 "${val}"로 변경했어요.`);
          }
          render();
        };
        inp.onblur = save;
        inp.onkeydown = e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){ inp.value=area.name; inp.blur(); } };
      };
    });

    // 스테퍼 직접 입력
    document.querySelectorAll('[data-stepper-input]').forEach(inp=>{
      const save = async ()=>{
        const id = inp.dataset.stepArea;
        const field = inp.dataset.stepField;
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        const min = 1;
        const max = 999;
        const val = Math.min(max, Math.max(min, parseInt(inp.value)||0));
        if(area[field]===val) return;
        area[field] = val;
        await updateAreaDB(area);
        render();
      };
      inp.onblur = save;
      inp.onkeydown = e=>{
        if(e.key==='Enter'){ inp.blur(); return; }
        if(!/[0-9]|Backspace|Delete|ArrowLeft|ArrowRight|Tab/.test(e.key)) e.preventDefault();
      };
    });

    // 난이도 토글
    document.querySelectorAll('[data-diff-area]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.diffArea;
        const val = parseInt(b.dataset.diffVal);
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        area.difficulty = val;
        await updateAreaDB(area);
        render();
      };
    });

    // 야외/실내 토글
    document.querySelectorAll('[data-indoor-area]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.indoorArea;
        const val = b.dataset.indoorVal === 'true';
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        area.isIndoor = val;
        await updateAreaDB(area);
        render();
      };
    });

    document.querySelectorAll('[data-require-worker]').forEach(b=>{
      b.onclick = async ()=>{
        const area = state.areas.find(a=>String(a.id)===String(b.dataset.requireWorker));
        if(!area) return;
        area.requireWorker = !area.requireWorker;
        await updateAreaDB(area);
        toast(`${area.name} 사역자 ${area.requireWorker?'필수':'선택'}으로 변경했어요.`);
        render();
      };
    });

    // 점검자 동행 토글
    document.querySelectorAll('[data-toggle-inspector]').forEach(btn=>{
      btn.onclick = async ()=>{
        const area = state.areas.find(a=>String(a.id)===String(btn.dataset.toggleInspector));
        if(!area) return;
        area.inspectorJoins = !area.inspectorJoins;
        await updateAreaDB(area);
        toast(`${area.name} 점검자 동행 ${area.inspectorJoins?'유':'무'}로 변경했어요.`);
        render();
      };
    });

    // 구역 인라인 편집 (성별 / 고정인원)
    document.querySelectorAll('.area-inline').forEach(input=>{
      input.onchange = async ()=>{
        const id = input.dataset.areaId;
        const field = input.dataset.areaField;
        const area = state.areas.find(a=>String(a.id)===String(id));
        if(!area) return;
        if(field==='fixedAdd'){
          const pid = input.value;
          if(!pid) return;
          area.fixedPeople = [...(area.fixedPeople||[]), pid];
          await updateAreaDB(area);
          render();
          toast(`고정인원을 추가했어요.`);
          return;
        }
        if(field==='genderFilter'){
          area.genderFilter = input.value;
          await updateAreaDB(area);
          render();
          toast(`${area.name} 성별을 변경했어요.`);
          return;
        }
        // (inspectorId 필드 제거됨)
        const val = parseInt(input.value);
        if(isNaN(val)||val<1) return;
        area[field] = val;
        await updateAreaDB(area);
        toast(`${area.name} ${field==='difficulty'?'난이도':'필요 인원'}을 ${val}로 변경했어요.`);
      };
    });
  }

  // generate tab — 프로젝트 탭 전환
  document.querySelectorAll('[data-project-id]').forEach(btn=>{
    btn.onclick = ()=>{
      state.draft = state.projects.find(p=>p.id===btn.dataset.projectId) || null;
      render();
    };
  });

  // 새 프로젝트 버튼
  const newProjectBtn = document.getElementById('newProjectBtn');
  if(newProjectBtn){
    newProjectBtn.onclick = ()=>{
      const form = document.getElementById('newProjectForm');
      if(form) { form.style.display = form.style.display==='none'?'flex':'none'; }
    };
  }
  const newProjectCancelBtn = document.getElementById('newProjectCancelBtn');
  if(newProjectCancelBtn){
    newProjectCancelBtn.onclick = ()=>{ document.getElementById('newProjectForm').style.display='none'; };
  }
  const newProjectConfirmBtn = document.getElementById('newProjectConfirmBtn');
  if(newProjectConfirmBtn){
    newProjectConfirmBtn.onclick = async ()=>{
      const name = document.getElementById('newProjectName').value.trim();
      const month = document.getElementById('newProjectMonth').value;
      if(!name){ toast('프로젝트 이름을 입력해주세요.'); return; }
      const draft = { month, label:name, assignments:{}, notes:[], status:'draft' };
      // 빈 구역 배정 초기화
      state.areas.forEach(a=>{ draft.assignments[a.id]=[]; });
      await createDraftDB(draft);
      state.projects.push(draft);
      state.draft = draft;
      render();
      toast(`"${name}" 프로젝트를 만들었어요.`);
    };
  }

  const genBtn = document.getElementById('genDraftBtn');
  if(genBtn){
    genBtn.onclick = async ()=>{
      const draft = generateDraft();
      // 기존 draft 전부 삭제 후 새로 생성
      const oldLabel = state.draft?.label || null;
      await Promise.all(state.projects.map(p=>deleteDraftDB(p.id)));
      state.projects = [];
      draft.label = oldLabel;
      await createDraftDB(draft);
      state.projects.push(draft);
      state.draft = draft;
      render();
    };
  }
  const regenBtn = document.getElementById('regenBtn');
  if(regenBtn){
    regenBtn.onclick = async ()=>{
      await deleteDraftDB(state.draft.id);
      const oldLabel = state.draft.label;
      state.projects = state.projects.filter(p=>p.id!==state.draft.id);
      const draft = generateDraft();
      draft.label = oldLabel;
      await createDraftDB(draft);
      state.projects.push(draft);
      state.draft = draft;
      render();
    };
  }
  const confirmBtn = document.getElementById('confirmBtn');
  if(confirmBtn){
    confirmBtn.onclick = async ()=>{
      await confirmDraftDB();
      state.draft.status='confirmed';
      state.history.push(state.draft);
      state.projects = state.projects.filter(p=>p.id!==state.draft.id);
      state.draft = state.projects[0] || null;
      render();
      toast('배정표를 확정했어요.');
    };
  }
  document.querySelectorAll('[data-remove-assign]').forEach(b=>{
    b.onclick = async ()=>{
      const [areaId, pid] = b.dataset.removeAssign.split('|');
      state.draft.assignments[areaId] = state.draft.assignments[areaId].filter(id=>id!==pid);
      await updateDraftDB();
      render();
    };
  });
  document.querySelectorAll('[data-add-to]').forEach(sel=>{
    sel.onchange = async ()=>{
      const areaId = sel.dataset.addTo;
      const pid = sel.value;
      if(!pid) return;
      state.draft.assignments[areaId].push(pid);
      await updateDraftDB();
      render();
    };
  });
  const deleteProjectBtn = document.getElementById('deleteProjectBtn');
  if(deleteProjectBtn){
    deleteProjectBtn.onclick = async ()=>{
      if(!confirm(`"${state.draft.label||state.draft.month}" 프로젝트를 삭제할까요?`)) return;
      await deleteDraftDB(state.draft.id);
      state.projects = state.projects.filter(p=>p.id!==state.draft.id);
      state.draft = state.projects[0] || null;
      render();
      toast('프로젝트를 삭제했어요.');
    };
  }
  const exportBtn = document.getElementById('exportImgBtn');
  if(exportBtn){
    exportBtn.onclick = ()=> exportBoardImage();
  }

  // history tab
  document.querySelectorAll('[data-view-history]').forEach(item=>{
    item.onclick = ()=>{
      const h = state.history.find(x=>x.id===item.dataset.viewHistory);
      document.getElementById('historyDetail').innerHTML = renderDraftBoard(h, false);
      bindEvents();
      document.getElementById('historyDetail').scrollIntoView({behavior:'smooth'});
    };
  });
}

async function exportBoardImage(){
  if(!state.draft) return;
  toast('이미지 생성 중...');

  const entry = state.draft;
  const areas = state.areas;
  const people = state.people;
  const assignments = entry.assignments || {};

  // 구역별 데이터 준비
  const rows = areas.map(area=>{
    const pids = assignments[area.id] || [];
    const members = pids.map(pid=>people.find(p=>p.id===pid)).filter(Boolean);
    const workers = members.filter(m=>m.category==='worker');
    const nonWorkers = members.filter(m=>m.category!=='worker');
    // 점검자: 해당 구역에 배정된 사역자 (첫 번째)
    const inspector = workers[0] || null;
    return { area, members, nonWorkers, workers, inspector };
  });

  const titleText = document.getElementById('exportTitle')?.value || `${entry.month} 본부 건물 청소당번표`;


  // 한 사람 이름 HTML (팀별 색상)
  const nameHtml = (p) => {
    const color = p.team==='초등' ? '#f97316' : p.team==='선교한국' ? '#3b82f6' : '#1f2937';
    const bold = p.team==='초등' || p.team==='선교한국';
    return `<span style="color:${color};font-weight:${bold?'700':'400'}">${p.name}</span>`;
  };

  const assigneeHtml = (row) => {
    const parts = row.nonWorkers.map(nameHtml);
    if(row.workers.length > 0) parts.push('<span style="color:#9ca3af"> / </span>' + row.workers.map(p=>`<span style="color:#6b7280">${p.name}</span>`).join(' '));
    return parts.join(' ') || '-';
  };

  const half = Math.ceil(rows.length / 2);
  const left = rows.slice(0, half);
  const right = rows.slice(half);

  // 귀여운 파스텔 팔레트
  const ACCENT   = '#7c6ff7';
  const HEADER_BG= '#ede9fe';
  const HEADER_TX= '#4c1d95';
  const STRIPE   = '#faf8ff';
  const BORDER   = '#ddd6fe';
  const BG       = '#ffffff';

  const makeRows = (list) => list.map((row, i) => {
    const bg = i % 2 === 1 ? STRIPE : '#fff';
    const base = `padding:9px 14px;font-size:13.5px;vertical-align:middle;border-bottom:1px solid ${BORDER};background:${bg};`;
    const areaC = base + `text-align:center;color:#1f2937;max-width:100px;word-break:keep-all;line-height:1.5;font-weight:600;`;
    const nameC = base + `text-align:left;`;
    const inspC = base + `text-align:center;color:${ACCENT};font-weight:700;font-size:13px;`;
    return `<tr>
      <td style="${areaC}">${row.area.name}</td>
      <td style="${nameC}">${assigneeHtml(row)}</td>
      <td style="${inspC}">${row.inspector ? row.inspector.name : ''}</td>
    </tr>`;
  }).join('');

  const thStyle = `background:#ede9fe;color:#4c1d95;font-weight:800;font-size:13px;padding:10px 14px;text-align:center;letter-spacing:0.04em;border-bottom:2px solid ${ACCENT};`;
  const makeTable = (list) => `
    <table style="border-collapse:collapse;flex:1;border-radius:14px;overflow:hidden;border:1.5px solid ${BORDER};box-shadow:0 2px 12px rgba(109,40,217,0.08);background:#fff;">
      <thead><tr>
        <th style="${thStyle}min-width:90px;">청소구역</th>
        <th style="${thStyle}">담당자</th>
        <th style="${thStyle}min-width:68px;">점검자</th>
      </tr></thead>
      <tbody>${makeRows(list)}</tbody>
    </table>`;

  const nukkiTag = `<div style="position:absolute;right:24px;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0.18;"><svg width="120" height="120" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>`;

  // 가로 고정 너비 (A4 가로 기준)
  const EXPORT_W = 900;

  const html = `
  <div style="font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f5f3ff;padding:0;width:${EXPORT_W}px;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(109,40,217,0.13);">
    <!-- 헤더 배너 -->
    <div style="position:relative;background:linear-gradient(120deg,#6d28d9 0%,#8b5cf6 55%,#a78bfa 100%);padding:22px 24px 0;min-height:180px;display:flex;align-items:center;">
      <div style="position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.08);"></div>
      <div style="position:absolute;left:-20px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);"></div>
      <div style="position:relative;z-index:2;padding-right:200px;padding-bottom:22px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <span style="display:inline-block;width:4px;height:32px;background:#fde68a;border-radius:2px;flex-shrink:0;"></span>
          <h1 style="font-size:30px;font-weight:900;color:#ffffff;margin:0;letter-spacing:-0.01em;text-shadow:0 2px 8px rgba(0,0,0,0.18);">${titleText}</h1>
        </div>
        <div style="display:flex;align-items:center;gap:6px;padding-left:14px;">
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);"></span>
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#fde68a;"></span>
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);"></span>
        </div>
      </div>
      ${nukkiTag}
    </div>
    <!-- 표 영역 -->
    <div style="padding:14px 20px 18px;display:flex;gap:14px;align-items:flex-start;">
      ${makeTable(left)}
      ${makeTable(right)}
    </div>
  </div>`;

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff;';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);

  html2canvas(wrapper.firstElementChild, { backgroundColor:'#ffffff', scale:1.5, useCORS:true }).then(srcCanvas=>{
    document.body.removeChild(wrapper);

    // 자연 높이로 렌더링 후 A4 가로 비율(297:210)에 맞게 패딩 추가
    const A4ratio = 297 / 210;
    const sw = srcCanvas.width, sh = srcCanvas.height;
    const targetH = Math.round(sw / A4ratio);

    let finalCanvas;
    if (sh >= targetH) {
      // 내용이 A4보다 길면 그대로 사용
      finalCanvas = srcCanvas;
    } else {
      // 아래에 여백 추가해서 A4 비율 맞춤
      finalCanvas = document.createElement('canvas');
      finalCanvas.width = sw;
      finalCanvas.height = targetH;
      const ctx = finalCanvas.getContext('2d');
      ctx.fillStyle = '#f5f3ff';
      ctx.fillRect(0, 0, sw, targetH);
      ctx.drawImage(srcCanvas, 0, 0);
    }

    const link = document.createElement('a');
    link.download = `청소당번표_${entry.month.replace(/\s/g,'')}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
  });
}

// ---------- 통합 이미지 분석 (구역 + 인원 동시 추출) ----------
async function handleRosterImage(file){
  const statusEl = document.getElementById('uploadStatus');
  const previewEl = document.getElementById('importPreview');
  statusEl.textContent = '이미지를 분석하는 중...';
  if(previewEl) previewEl.innerHTML = '';
  try{
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=> res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const mediaType = file.type || 'image/png';
    const response = await fetch('https://pvuriqyiyghjuprewkwj.supabase.co/functions/v1/analyze-image', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ base64, mediaType, mode:'auto' })
    });
    const data = await response.json();

    // ── 청소당번표 형식 ──────────────────────────────────────
    if(data.type === 'schedule' || (Array.isArray(data.rows) && data.rows.length > 0)){
      const rows = data.rows || [];
      const title = data.title || '';
      statusEl.innerHTML = `<strong>청소 당번표 추출 완료!</strong> ${rows.length}개 구역`;
      if(!previewEl) return;
      const tableRows = rows.map(r=>`
        <tr>
          <td style="font-weight:600">${r.area||''}</td>
          <td>${(r.assignees||[]).join(', ')}</td>
          <td style="color:var(--navy)">${r.inspector||'-'}</td>
        </tr>`).join('');
      const cancelBtn = `<button class="btn ghost small" id="cancelImportBtn" style="margin-bottom:10px;">✕ 취소하기</button>`;
      previewEl.innerHTML = `${cancelBtn}
        <div class="card" style="padding:16px;">
          ${title ? `<h2 style="margin-bottom:12px;">${title}</h2>` : ''}
          <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>청소구역</th><th>담당자</th><th>점검자</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
            <button class="btn" id="saveScheduleBtn">배정표로 저장하기</button>
            <button class="btn ghost small" id="extractPeopleFromScheduleBtn">인원만 명단에 추가</button>
          </div>
        </div>`;
      document.getElementById('cancelImportBtn').onclick = ()=>{ previewEl.innerHTML=''; statusEl.textContent=''; };

      // 배정표로 저장
      document.getElementById('saveScheduleBtn').onclick = async ()=>{
        const btn = document.getElementById('saveScheduleBtn');
        btn.disabled = true; btn.textContent = '저장 중...';
        // 구역 매칭 & 배정 맵 생성
        const assignments = {};
        for(const r of rows){
          let area = state.areas.find(a=>a.name===r.area);
          if(!area){
            const newArea = {name:r.area, capacity:(r.assignees||[]).length||1, difficulty:1, genderFilter:'all', fixedPeople:[]};
            await addAreaDB(newArea); state.areas.push(newArea); area = newArea;
          }
          const pids = (r.assignees||[]).map(name=>{
            const p = state.people.find(x=>x.name===name);
            return p ? p.id : null;
          }).filter(Boolean);
          if(area.id) assignments[area.id] = pids;
        }
        const month = new Date().toISOString().slice(0,7);
        const draft = { month, assignments, notes:[], status:'confirmed' };
        await createDraftDB(draft);
        state.draft = draft;
        render();
        toast('배정표를 저장했어요.');
      };

      // 인원만 추가
      document.getElementById('extractPeopleFromScheduleBtn').onclick = async ()=>{
        const btn = document.getElementById('extractPeopleFromScheduleBtn');
        btn.disabled = true; btn.textContent = '추가 중...';
        const allNames = [...new Set(rows.flatMap(r=>[...(r.assignees||[]), r.inspector||''].filter(n=>n && n.length>=2)))];
        let added = 0;
        for(const name of allNames){
          if(!state.people.find(p=>p.name===name)){
            const person = {name, gender:'m', category:'normal', team:'', role:null, mentorId:null, age:null};
            await addPersonDB(person); state.people.push(person); added++;
          }
        }
        btn.textContent = `✓ ${added}명 추가 완료`;
        toast(`${added}명을 추가했어요.`);
        render();
      };
      return;
    }

    // ── 명렬표(인원 목록) 형식 ─────────────────────────────────
    const areas = Array.isArray(data.areas) ? data.areas.filter(a=>a.name) : [];
    const newAreas = areas.filter(a=>!state.areas.some(x=>x.name===a.name));
    const dupAreas = areas.filter(a=>state.areas.some(x=>x.name===a.name));

    // 인원 (성별·카테고리 포함)
    let people = Array.isArray(data.people) && data.people.length>0
      ? data.people
      : (Array.isArray(data.names) ? data.names.map(n=>({name:n,gender:'m',category:'normal'})) : []);
    people = people.filter(p=>p.name && p.name.trim().length>=2);
    const seen = new Set();
    const newPeople = people.filter(p=>{
      const name = p.name.trim();
      if(seen.has(name)) return false;
      seen.add(name);
      return !state.people.some(x=>x.name===name);
    });
    const dupPeople = people.filter(p=>state.people.some(x=>x.name===p.name.trim())).map(p=>p.name.trim());

    if(areas.length===0 && people.length===0){
      statusEl.textContent = '인식하지 못했어요. 다시 시도해주세요.';
      return;
    }

    let statusParts = ['<strong>분석 완료!</strong>'];
    if(dupAreas.length>0) statusParts.push(`🔁 중복 구역: ${dupAreas.map(a=>a.name).join(', ')}`);
    if(dupPeople.length>0) statusParts.push(`🔁 중복 인원: ${dupPeople.join(', ')}`);
    statusEl.innerHTML = statusParts.join('<br>');

    if(!previewEl) return;

    // 구역 미리보기
    const areasHtml = newAreas.length>0 ? `
      <div class="card">
        <h2>추출된 구역 (${newAreas.length}개)</h2>
        <p class="desc">난이도는 기본값 1이에요. 추가 후 구역 관리에서 수정해주세요.</p>
        <table><thead><tr><th>구역명</th><th>필요 인원</th></tr></thead><tbody>
          ${newAreas.map(a=>`<tr><td>${a.name}</td><td>${a.capacity||1}명</td></tr>`).join('')}
        </tbody></table>
        <button class="btn" id="addAreasBtn" style="margin-top:14px;">구역 ${newAreas.length}개 추가하기</button>
      </div>` : '';

    // 인원 미리보기
    const peopleHtml = newPeople.length>0 ? `
      <div class="card">
        <h2>추출된 인원 (${newPeople.length}명)</h2>
        <p class="desc">성별·카테고리가 자동 인식돼요. 추가 후 수정 가능해요.</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
          ${newPeople.map(p=>`<span class="chip">
            <span class="tag ${p.gender==='f'?'f':'m'}" style="font-size:10px;">${p.gender==='f'?'여':'남'}</span>
            <span class="tag ${p.category||'normal'}" style="font-size:10px;">${catLabel(p.category||'normal')}</span>
            ${p.name.trim()}
          </span>`).join('')}
        </div>
        <button class="btn" id="addPeopleBtn">인원 ${newPeople.length}명 추가하기</button>
      </div>` : '';

    const cancelImportBtn = `<button class="btn ghost small" id="cancelImportBtn" style="margin-bottom:8px;">✕ 취소하기</button>`;
    previewEl.innerHTML = cancelImportBtn + areasHtml + peopleHtml;
    document.getElementById('cancelImportBtn').onclick = ()=>{
      previewEl.innerHTML='';
      statusEl.textContent='';
    };

    // 구역 추가
    const addAreasBtn = document.getElementById('addAreasBtn');
    if(addAreasBtn){
      addAreasBtn.onclick = async()=>{
        addAreasBtn.disabled=true; addAreasBtn.textContent='추가 중...';
        for(const a of newAreas){
          const area = {name:a.name, capacity:a.capacity||1, difficulty:1};
          await addAreaDB(area); state.areas.push(area);
        }
        addAreasBtn.textContent=`✓ ${newAreas.length}개 추가 완료`;
        toast(`구역 ${newAreas.length}개를 추가했어요.`);
      };
    }

    // 인원 추가
    const addPeopleBtn = document.getElementById('addPeopleBtn');
    if(addPeopleBtn){
      addPeopleBtn.onclick = async()=>{
        addPeopleBtn.disabled=true; addPeopleBtn.textContent='추가 중...';
        for(const p of newPeople){
          const person = {
            name: p.name.trim(),
            gender: p.gender==='f'?'f':'m',
            category: ['worker','mentor','mentee','normal'].includes(p.category)?p.category:'normal',
            team:'', role:null, mentorId:null, age:null
          };
          await addPersonDB(person); state.people.push(person);
        }
        addPeopleBtn.textContent=`✓ ${newPeople.length}명 추가 완료`;
        toast(`인원 ${newPeople.length}명을 추가했어요.`);
        render();
      };
    }
  }catch(e){
    statusEl.textContent='분석 중 문제가 발생했어요. 다시 시도해주세요.';
  }
}

// ── AUTH ──
function showAuthScreen(){ document.getElementById('authScreen').classList.add('show'); document.getElementById('root').style.display='none'; }
function hideAuthScreen(){ document.getElementById('authScreen').classList.remove('show'); document.getElementById('root').style.display=''; }

let _authMode = 'login';
function switchAuthTab(mode){
  _authMode = mode;
  document.getElementById('authTabLogin').classList.toggle('active', mode==='login');
  document.getElementById('authTabSignup').classList.toggle('active', mode==='signup');
  document.getElementById('authSubmitBtn').textContent = mode==='login' ? '로그인' : '회원가입';
  document.getElementById('authMsg').textContent = '';
}

async function doAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPw').value;
  const msg = document.getElementById('authMsg');
  if(!email||!pw){ msg.textContent='이메일과 비밀번호를 입력해주세요.'; msg.className='auth-msg error'; return; }
  msg.textContent='처리 중...'; msg.className='auth-msg';
  if(_authMode==='login'){
    const {error} = await sb.auth.signInWithPassword({email, password:pw});
    if(error){ msg.textContent=error.message==='Invalid login credentials'?'이메일 또는 비밀번호가 맞지 않아요.':error.message; msg.className='auth-msg error'; }
  } else {
    const {error} = await sb.auth.signUp({email, password:pw});
    if(error){ msg.textContent=error.message; msg.className='auth-msg error'; }
    else { msg.textContent='가입 완료! 이메일 인증 후 로그인해주세요.'; msg.className='auth-msg success'; }
  }
}

async function signInGoogle(){
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: 'https://juel2414.github.io/cleaning-schedule/' } });
}

async function signOut(){
  await sb.auth.signOut();
  currentUser = null;
  showAuthScreen();
}

async function claimExistingData(uid){
  await Promise.all([
    sb.from('people').update({user_id:uid}).is('user_id',null),
    sb.from('areas').update({user_id:uid}).is('user_id',null),
    sb.from('schedules').update({user_id:uid}).is('user_id',null),
  ]);
}

sb.auth.onAuthStateChange(async (event, session) => {
  if(session?.user){
    const wasLoggedOut = !currentUser;
    currentUser = session.user;
    if(wasLoggedOut || event==='SIGNED_IN'){
      hideAuthScreen();
      await loadAll();
    }
  } else {
    currentUser = null;
    showAuthScreen();
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
